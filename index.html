<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Арины</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный абстрактный фон */
        .bg-visual {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: blur(80px);
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        .blob-1 { background: #1e1b4b; top: -10%; left: -10%; }
        .blob-2 { background: #312e81; bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #1e1b4b; top: 20%; right: 10%; animation-delay: -10s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            perspective: 1000px; /* Для 3D эффекта перехода */
        }

        /* Стиль карточки */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            visibility: hidden;
        }

        .card.active {
            opacity: 1;
            visibility: visible;
        }

        /* Эффект ухода первой карточки */
        .card.exit {
            transform: translate(-50%, -50%) scale(0.8) rotateX(10deg);
            filter: blur(10px);
            opacity: 0;
        }

        /* Текст */
        h1 {
            font-size: 26px;
            font-weight: 300;
            line-height: 1.5;
            letter-spacing: 1px;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Кнопка */
        .btn {
            background: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 18px 35px;
            border-radius: 100px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s;
        }

        .btn:hover {
            background: white;
            color: black;
            border-color: white;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #step2 h1 {
            margin-bottom: 0;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

    </style>
</head>
<body>

<!-- Фон -->
<div class="bg-visual">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="container">
    <!-- ЭКРАН 1 -->
    <div class="card active" id="step1">
        <h1>Арин, я те хочу<br>кое-че сказать...</h1>
        <button class="btn" onclick="nextStep()">Посмотри, если интересно</button>
    </div>

    <!-- ЭКРАН 2 -->
    <div class="card" id="step2">
        <h1>Спасибо,<br>что мы познакомились</h1>
    </div>
</div>

<script>
    function nextStep() {
        const s1 = document.getElementById('step1');
        const s2 = document.getElementById('step2');

        // Запускаем анимацию ухода
        s1.classList.add('exit');
        
        setTimeout(() => {
            s1.classList.remove('active');
            s2.classList.add('active');
            // Вторая карточка плавно проявляется сама за счет CSS transition
        }, 600);
    }
</script>

</body>
</html>
